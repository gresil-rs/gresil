[package]
name = "qemu-riscv-leg-a"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Leg A of the QEMU riscv64gc proof: bare-metal none-elf exact-value gate over the no_std gresil surface"

[workspace]

[dependencies]
gresil = { path = "../../crates/gresil", default-features = false, features = ["unstable-stdp", "unstable-bridge"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
