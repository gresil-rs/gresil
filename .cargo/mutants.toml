# The mutation pass's config (tools/mutants.sh): cargo-mutants 27.1.0
# reads it all, tools/mutants/rules.py `exclude_re` alone. cargo-mutants
# refuses a key it does not know, so the rules keep none of their own.

# No warning makes a mutant unviable, whatever RUSTFLAGS the caller
# exports; the rules add the same --cap-lints=warn.
cap_lints = true

# An equivalent mutant goes here: one regex over its name, which has one
# shape in both tools (`<file>:<line>:<col>: <what> in <fn>`), with a
# comment above it saying why no test can kill it.
exclude_re = [
    # nir2json's `read_weight`, its length check made false (PR #52's first
    # run, `db52d06`). hdf5-pure reads a dataset whole, at its dataspace's
    # size or not at all: compact or contiguous data of another size is a
    # `DataSizeMismatch`, chunked data and unallocated storage fill a
    # buffer of the dataspace's size. A 2-D weight read gives rows × cols
    # values, so the check never fires; it stays as the guard before `W` is
    # read as rows by cols.
    'crates/gresil-nir2json/src/lib\.rs:[0-9]+:[0-9]+: replace if condition vals\.len\(\) != rows \* cols with false in read_weight',
    # nir2json's `convert_file_opts`, the edge list's capacity
    # `flat.len() / 2` made `/ 3` (PR #52's first run, `db52d06`): a
    # `Vec`'s capacity, which no value reads. Its column, since `replace 2
    # with 3` names three more mutants in the function.
    'crates/gresil-nir2json/src/lib\.rs:[0-9]+:74: replace 2 with 3 in convert_file_opts',
    # The CSR's capacity in the two constructors,
    # `SparseSynapseMatrix::new(neuron_count, 0)` made 1 (round 67's
    # pass): it sizes empty `Vec`s, and no value reads a capacity. Their
    # column, since `replace 0 with 1` names three more mutants in each.
    'crates/gresil/src/network\.rs:[0-9]+:68: replace 0 with 1 in SpikingNeuralNetwork::new_with_voltage_resolution',
    'crates/gresil/src/network\.rs:[0-9]+:68: replace 0 with 1 in SpikingNeuralNetwork::from_neurons',
    # `NirName::new`'s padding, `[0u8; Self::CAP]` made `1u8` (round 68's
    # pass): only the derived equality reads the bytes past the kept
    # ones, and every name is built by `new`, so any two pad alike.
    'crates/gresil/src/nir\.rs:[0-9]+:26: replace 0u8 with 1u8 in NirName::new',
    # gresil-trace-diff's `compare`, the cut-off test's `end < head` made
    # `<=` (round 79's pass): a line is a header or the end line, never
    # both, so the last of each are never one index. Its column, so a
    # later `<` in the function stays in the pass.
    'crates/gresil-trace-diff/src/lib\.rs:[0-9]+:40: replace < with <= in compare',
]
