# neuralos-snn's last release. The library is published as `gresil` from
# 0.1.0-alpha.9 (crates/gresil); this package is the pointer, published
# once from alpha.9's tagged commit, and the next PR deletes it (ruled
# 2026-10-20: a one-PR exception to "no empty scaffolding crates"). Its
# own [workspace] table keeps it out of the repo's workspace.
[package]
name = "neuralos-snn"
version = "0.1.0-alpha.9"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["philo-the-dendron"]
description = "Moved to gresil: https://crates.io/crates/gresil"
repository = "https://gitea.com/gresil-rs/gresil"
readme = "README.md"

[workspace]
